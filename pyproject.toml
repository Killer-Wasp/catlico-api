[project]
name = "catlico-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.136.3",
    "greenlet>=3.5.1",
    "pyjwt>=2.10.1",
    "pwdlib[bcrypt]>=0.2.1",
    "sqlmodel>=0.0.38",
    "fsspec>=2026.4.0",
    "s3fs>=2026.4.0",
    "anyio>=4.13.0",
    "cryptography>=49.0.0",
    "croniter>=3.0",
]

# Optional attachment-storage providers (Phase 6 §6.4). The core install ships
# local + s3 (s3fs, in `dependencies` above); S3-compatible stores (SeaweedFS,
# MinIO) work with the base install via S3_ENDPOINT_URL. GCS and Azure Blob need
# their fsspec adapter — install the matching extra and set STORAGE_PROTOCOL:
#
#   pip install "catlico-backend[gcs]"     # STORAGE_PROTOCOL=gcs
#   pip install "catlico-backend[azure]"   # STORAGE_PROTOCOL=az | abfs
#   uv sync --extra gcs --extra azure
#
# See docs/storage-providers.md for credential wiring per provider.
[project.optional-dependencies]
gcs = ["gcsfs>=2026.4.0"]
azure = ["adlfs>=2024.7.0"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "moto[s3,server]>=5.2.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
